name: Build iOS IPA

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build-ios:
runs-on: macos-15
steps:
- name: Checkout source
uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      channel: stable
      cache: true
  - name: Show Flutter version
    run: flutter --version
  - name: Install dependencies
    run: flutter pub get
  - name: Check iOS project
    run: |
      test -d ios
      test -f pubspec.yaml
      flutter doctor -v
  - name: Build iOS release
    run: flutter build ios --release --no-codesign
  - name: Package unsigned app as IPA
    run: |
      mkdir -p Payload
      cp -R build/ios/iphoneos/Runner.app Payload/
      /usr/bin/zip -r -y build/ios/Runner-unsigned.ipa Payload
  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: Runner-unsigned-IPA
      path: build/ios/Runner-unsigned.ipa
      if-no-files-found: error
      retention-days: 7
